utside'}\n    return {'topic': topic, 'route': 'search'}\n\ndef ask_topic(state, context):\n    \"\"\"缺少主题时，明确请求补充，而不是猜测。\"\"\"\n    return {'answer': '请告诉我你想学习的课程主题。'}\n\ndef search_catalog(state, context):\n    \"\"\"调用项目真实工具；捕获失败，提供明确失败状态供图路由。\"\"\"\n    try:\n        result = search_courses(state['topic'])\n        return {'documents': result['items'], 'source': result['source'], 'error': ''}\n    except Exception as error:\n        return {'documents': [], 'source': '', 'error': str(error)}\n\ndef answer_courses(state, context):\n    \"\"\"有资料才回答；两种模型模式清楚分开。\"\"\"\n    if context['mode'] == 'real':\n        from langchain_openai import ChatOpenAI\n        import os\n        model = ChatOpenAI(model=os.environ.get('OPENAI_MODEL', 'gpt-4.1-mini'), timeout=25, max_retries=0)\n        reply = model.invoke('你是课程咨询助手。仅根据以下资料回答，不编造。问题：' + state['question']\n                             + '\\n资料：' + json.dumps(state['documents'], ensure_ascii=False))\n        return {'answer': str(reply.content)}\n    return {'answer': '【模拟模型】找到课程：' + json.dumps(state['documents'], ensure_ascii=False)}\n\ndef tool_error(state, context):\n    \"\"\"工具失败独立出口，避免宣称查询成功。\"\"\"\n    return {'answer': '课程查询失败，请稍后重试。'}\n\ndef no_result(state, context):\n    \"\"\"没有资料时如实回应。\"\"\"\n    return {'answer': '未找到该主题课程，请换一个主题。'}\n\ndef invalid_request(state, context):\n    \"\"\"类型错误不进入工具。\"\"\"\n    return {'answer': '问题必须是文字。'}\n\ndef outside_scope(state, context):\n    \"\"\"本任务只做课程咨询。\"\"\"\n    return {'answer': '我只能提供课程咨询，无法处理这个任务。'}\n\ndef agent_model(state, context):\n    \"\"\"动态路线：模型返回工具调用或最终回答；保存公开消息，不展示私有推理。\"\"\"\n    from langchain_core.messages import AIMessage, HumanMessage, messages_to_dict, messages_from_dict\n    messages = messages_from_dict(state.get('messages', []))\n    if not messages: messages = [HumanMessage(content=state['question'])]\n    attempts = state.get('attempts', 0) + 1\n    if attempts >= 3:\n        reply = AIMessage(content='已达到模型调用上限，结束本次任务。')\n    elif context['mode'] == 'real':\n        import os\n        from langchain_openai import ChatOpenAI\n        model = ChatOpenAI(model=os.environ.get('OPENAI_MODEL', 'gpt-4.1-mini'), timeout=25, max_retries=0)\n        reply = model.bind_tools([search_courses]).invoke(messages)\n    elif messages[-1].type == 'tool':\n        reply = AIMessage(content='【模拟模型】根据工具结果回答：' + str(messages[-1].content))\n    elif not state['question'].strip():\n        reply = AIMessage(content='请补充课程主题。')\n    elif any(word in state['question'] for word in ('转账', '天气', '删除文件')):\n        reply = AIMessage(content='我只能提供课程咨询。')\n    else:\n        reply = AIMessage(content='', tool_calls=[{'name': 'search_courses', 'args': {'topic': state['question']}, 'id': 'course_' + str(attempts), 'type': 'tool_call'}])\n    messages.append(reply)\n    return {'messages': messages_to_dict(messages), 'attempts': attempts,\n            'choice': 'tools' if reply.tool_calls else 'finish', 'answer': str(reply.content)}\n\ndef agent_tools(state, context):\n    \"\"\"按模型公开 tool_calls 调用允许的工具；ToolMessage 对齐调用 ID。\"\"\"\n    from langchain_core.messages import ToolMessage, messages_to_dict, messages_from_dict\n    messages = messages_from_dict(state['messages'])\n    for call in messages[-1].tool_calls:\n        try:\n            if call['name'] != 'search_courses': raise ValueError('不允许的工具')\n            value = search_courses(**call['args'])\n        except Exception as error:\n            value = {'error': str(error)}\n        messages.append(ToolMessage(content=json.dumps(value, ensure_ascii=False), tool_call_id=call['id']))\n    return {'messages': messages_to_dict(messages), 'tool_steps': state.get('tool_steps', 0) + 1}\n", "graph_nodes": ["validate", "ask", "search", "answer", "error", "missing", "invalid", "outside"], "explanations": [{"block": "validate_request", "why": "把一个职责封装成可运行节点", "input": "question", "action": "validate_request 从输入计算返回字段，不修改其他节点状态。", "output": "topic, route", "consequence": "返回字段或异常路径不一致会影响 用业务记忆：本课一次输入一次回答。未来多轮咨询再加入会话笔记。课堂学习进度仍保存。\r\n\r\n## 08 状态与更新规则\r\n\r\nquestion/topic 为字符串；documents 为列表；answer/error 为字符串。字段普通覆盖，查询写资料或错误。\r\n\r\n## 09 节点\r\n\r\n检查输入、追问、查询目录、说明错误、说明不足、生成回答。每个节点读写字段按契约定义。\r\n\r\n## 10 连线、入口与终点\r\n\r\nSTART 进入检查输入，查询后分出口；所有终端回应节点连接 END。\r\n\r\n## 11 条件分支与路由\r\n\r\n缺主题走追问；完整走查询；error 非空走说明错误；documents 为空走说明不足；有资料走生成回答。\r\n\r\n## 12 循环、重试与停止\r\n\r\n不自动重试；查询失败直接说明错误并结束。每个请求最多查询一次，无业务循环。\r\n\r\n## 13 持久化、人工审核与恢复\r\n\r\n不采用业务持久化和人工审核：没有跨进程恢复或外部写动作。未来加入报名动作时重新设计审核。\r\n\r\n## 14 输出检查、评估与观察\r\n\r\n已保存正常与缺主题两条模拟轨迹；无资料、工具超时及越界请求仍需演练，不能称评估完成。\r\n\r\n## 15 整体设计与实施交接\r\n\r\n本看板展示演示假设。完成剩余测试并导出设计、契约、测试、交接说明后才可标记设计完成。\r\n", "sha": "d8869e826b80245a3b36f3d71b199ead2732ce5c306dca05f445cb1e4da28935"}, {"path": "agent-design/architecture.mmd", "purpose": "", "caller": "", "kind": "", "size": 637, "modified": 1791521448.7776127, "editable": false, "symbols": [], "content": "%% generated by agent-development-coach\r\nflowchart TD\r\n  START[\"开始\"]\r\n  validate[\"检查输入\"]\r\n  ask[\"追问学习主题\"]\r\n  search[\"查询课程目录\"]\r\n  error[\"说明查询错误\"]\r\n  missing[\"说明资料不足\"]\r\n  answer[\"生成带出处的回答\"]\r\n  END[\"本轮结束\"]\r\n  invalid[\"输入类型错误\"]\r\n  outside[\"任务超出范围\"]\r\n  START --> validate\r\n  validate --> ask\r\n  validate --> search\r\n  search --> error\r\n  search --> missing\r\n  search --> answer\r\n  ask --> END\r\n  error --> END\r\n  missing --> END\r\n  answer --> END\r\n  validate --> invalid\r\n  validate --> outside\r\n  invalid --> END\r\n  outside --> END\r\n", "sha": "1b58ddb577579cfec1cce8921386aa0b9b5bde23db442838a90fc523e39e9c79", "notice": "由当前设计自动生成。请在设计结构或结构图修改，再保存同步。"}, {"path": "agent-design/design-contracts.md", "purpose": "", "caller": "", "kind": "", "size": 4871, "modified": 1791521448.7776127, "editable": false, "symbols": [], "content": "\u003c!-- generated by agent-development-coach; edit teaching-state.json/design -->\r\n# 结构化契约\r\n\r\n```json\r\n{\r\n  \"inputs\": [\r\n    \"question\"\r\n  ],\r\n  \"outputs\": [\r\n    \"answer\" \r\n\r\nsearch_courses(topic) 返回 items 与 source；无结果为 []，失败抛异常。search_catalog 捕获异常后写 error，路由到失败出口；工具只读。\r\n\r\n## 知识与检索\r\n\r\n采用课堂目录普通查询；当前不采用向量库。目录由机构更新，回答引用目录编号。\r\n\r\n## 记忆\r\n\r\n不采用业务记忆：本课一次输入一次回答。未来多轮咨询再加入会话笔记。课堂学习进度仍保存。\r\n\r\n## 运行状态\r\n\r\nquestion/topic 为字符串；documents 为列表；answer/error 为字符串。字段普通覆盖，查询写资料或错误。\r\n\r\n## 处理节点\r\n\r\n检查输入、追问、查询目录、说明错误、说明不足、生成回答。每个节点读写字段按契约定义。\r\n\r\n## 流程连接\r\n\r\nSTART 进入检查输入，查询后分出口；所有终端回应节点连接 END。\r\n\r\n## 条件分支\r\n\r\n缺主题走追问；完整走查询；error 非空走说明错误；documents 为空走说明不足；有资料走生成回答。\r\n\r\n## 循环与重试\r\n\r\n不自动重试；查询失败直接说明错误并结束。每个请求最多查询一次，无业务循环。\r\n\r\n## 人工介入\r\n\r\n不采用业务持久化和人工审核：没有跨进程恢复或外部写动作。未来加入报名动作时重新设计审核。\r\n\r\n## 运行验证\r\n\r\n覆盖正常、类型错误、缺少主题、无资料、工具失败和越界六类输入；保留实际节点执行轨迹和源代码哈希。\r\n\r\n## 交付\r\n\r\n本看板展示演示假设。完成剩余测试并导出设计、契约、测试、交接说明后才可标记设计完成。\r\n\r\n", "sha": "440523800ee073f298f1e683db2de4a2ada6c7eaaa28bff13105850d911e19c7", "notice": "由当前设计自动生成。请在设计结构或结构图修改，再保存同步。"}, {"path": "agent-design/teaching-state.json", "purpose": "", "caller": "", "kind": "", "size": 111522, "modified": 1791599809.638129, "editable": true, "symbols": [], "content": "{\r\n  \"schema_version\": 1,\r\n  \"title\": \"课程咨询助手 · 课堂模拟示例\",\r\n  \"mode\": \"教师演示\",\r\n  \"delivery\": \"设计与代码\",\r\n  \"current_module\": \"tools\",\r\n  \"design_status\": \"进行中\",\r\n  \"decisions\": {\r\n    \"goal\": \"帮助学员查询和推荐课程；不替学员报名、不承诺课程效果。成功结果含课程、理由、出处。\",\r\n    \"io\": \"输入 question 与 topic；输出 answer 和 sources。主题缺失则追问并结束本轮。选 LangGraph 自定义分支，模型可用 LangChain 接口。\",\r\n    \"model\": \"框架模式执行真实 LangGraph，使用明确标注的模拟回答；真实模型只在配置密钥并选择 real 后调用。\",\r\n    \"prompt\": \"只依据课程资料回答；说明资料不足；不编造价格和效果；不付款报名。\",\r\n    \"tools\": \"search_courses(topic) 返回 items 与 source；无结果为 []，失败抛异常。search_catalog 捕获异常后写 error，路由到失败出口；工具只读。\",\r\n    \"knowledge\": \"采用课堂目录普通查询；当前不采用向量库。目录由机构更新，回答引用目录编号。\",\r\n    \"memory\": \"不采用业务记忆：本课一次输入一次回答。未来多轮咨询再加入会话笔记。课堂学习进度仍保存。\",\r\n    \"state\": \"question/topic 为字符串；documents 为列表；answer/error 为字符串。字段普通覆盖，查询写资料或错误。\",\r\n    \"nodes\": \"检查输入、追问、查询目录、说明错误、说明不足、生成 nAI\\n        import os\\n        model = ChatOpenAI(model=os.environ.get('OPENAI_MODEL', 'gpt-4.1-mini'), timeout=25, max_retries=0)\\n        reply = model.invoke('你是课程咨询助手。仅根据以下资料回答，不编造。问题：' + state['question']\\n                             + '\\\\n资料：' + json.dumps(state['documents'], ensure_ascii=False))\\n        return {'answer': str(reply.content)}\\n    return {'answer': '【模拟模型】找到课程：' + json.dumps(state['documents'], ensure_ascii=False)}\\n\\ndef tool_error(state, context):\\n    \\\"\\\"\\\"工具失败独立出口，避免宣称查询成功。\\\"\\\"\\\"\\n    return {'answer': '课程查询失败，请稍后重试。'}\\n\\ndef no_result(state, context):\\n    \\\"\\\"\\\"没有资料时如实回应。\\\"\\\"\\\"\\n    return {'answer': '未找到该主题课程，请换一个主题。'}\\n\\ndef invalid_request(state, context):\\n    \\\"\\\"\\\"类型错误不进入工具。\\\"\\\"\\\"\\n    return {'answer': '问题必须是文字。'}\\n\\ndef outside_scope(state, context):\\n    \\\"\\\"\\\"本任务只做课程咨询。\\\"\\\"\\\"\\n    return {'answer': '我只能提供课程咨询，无法处理这个任务。'}\\n\\ndef agent_model(state, context):\\n    \\\"\\\"\\\"动态路线：模型返回工具调用或最终回答；保存公开消息，不展示私有推理。\\\"\\\"\\\"\\n    from langchain_core.messages import AIMessage, HumanMessage, messages_to_dict, messages_from_dict\\n    messages = messages_from_dict(state.get('messages', []))\\n    if not messages: messages = [HumanMessage(content=state['question'])]\\n    attempts = state.get('attempts', 0) + 1\\n    if attempts >= 3:\\n        reply = AIMessage(content='已达到模型调用上限，结束本次任务。')\\n    elif context['mode'] == 'real':\\n        import os\\n        from langchain_openai import ChatOpenAI\\n        model = ChatOpenAI(model=os.environ.get('OPENAI_MODEL', 'gpt-4.1-mini'), timeout=25, max_retries=0)\\n        reply = model.bind_tools([search_courses]).invoke(messages)\\n    elif messages[-1].type == 'tool':\\n        reply = AIMessage(content='【模拟模型】根据工具结果回答：' + str(messages[-1].content))\\n    elif not state['question'].strip():\\n        reply = AIMessage(content='请补充课程主题。')\\n    elif any(word in state['question'] for word in ('转账', '天气', '删除文件')):\\n        reply = AIMessage(content='我只能提供课程咨询。')\\n    else:\\n        reply = AIMessage(content='', tool_calls=[{'name': 'search_courses', 'args': {'topic': state['question']}, 'id': 'course_' + str(attempts), 'type': 'tool_call'}])\\n    messages.append(reply)\\n    return {'messages': messages_to_dict(messages), 'attempts': attempts,\\n            'choice': 'tools' if reply.tool_calls else 'finish', 'answer': str(reply.content)}\\n\\ndef agent_tools(state, context):\\n    \\\"\\\"\\\"按模型公开 tool_calls 调用允许的工具；ToolMessage 对齐调用 ID。\\\"\\\"\\\"\\n    from langchain_core.messages import ToolMessage, messages_to_dict, messages_from_dict\\n    messages = messages_from_dict(state['messages'])\\n    for call in messages[-1].tool_calls:\\n        try:\\n            if call['name'] != 'search_courses': raise ValueError('不允许的工具')\\n            value = search_courses(**call['args'])\\n        except Exception as error:\\n            value = {'error': str(error)}\\n        messages.append(ToolMessage(content=json.dumps(value, ensure_ascii=False), tool_call_id=call['id']))\\n    return {'messages': messages_to_dict(messages), 'tool_steps': state.get('tool_steps', 0) + 1}\\n\",\r\n          \"graph_nodes\": [\r\n            \"validate\",\r\n            \"ask\",\r\n            \"search\",\r\n            \"answer\",\r\n            \"error\",\r\n            \"missing\",\r\n            \"invalid\",\r\n            \"outside\"\r\n          ],\r\n          \"explanations\": [\r\n            {\r\n              \"block\": \"validate_request\",\r\n              \"why\": \"把一个职责封装成可运行节点\",\r\n              \"input\": \"question\",\r\n              \"action\": \"validate_request 从输入计算返回字段，不修改其他节点状态。\",\r\n              \"output\": \"topic, route\",\r\n              \"consequence\": \"返回字段或异常路径不一致会影响后续节点与验收。\",\r\n              \"graph_node\": \"validate\"\r\n            },\r\n            {\r\n              \"block\": \"ask_topic\",\r\n              \"why\": \"把一个职责封装成可运行节点\",\r\n 回应节点连接 END。\",\r\n        \"routing\": \"缺主题走追问；完整走查询；error 非空走说明错误；documents 为空走说明不足；有资料走生成回答。\",\r\n        \"loops\": \"不自动重试；查询失败直接说明错误并结束。每个请求最多查询一次，无业务循环。\",\r\n        \"control\": \"不采用业务持久化和人工审核：没有跨进程恢复或外部写动作。未来加入报名动作时重新设计审核。\",\r\n        \"evaluation\": \"覆盖正常、类型错误、缺少主题、无资料、工具失败和越界六类输入；保留实际节点执行轨迹和源代码哈希。\",\r\n        \"delivery\": \"本看板展示演示假设。完成剩余测试并导出设计、契约、测试、交接说明后才可标记设计完成。\"\r\n      }\r\n    }\r\n  ],\r\n  \"current_action\": \"\"\r\n}", "sha": "e9e97dfa65eac50fd6035a54f346d20e0c947a029fd593321fb61de64dc9fede"}, {"path": "implementation/agent_nodes.py", "purpose": "校验、调用工具、处理异常、模拟/真实模型回答；对比动态工具决策", "caller": "run_design.py 根据节点契约绑定", "kind": "业务代码", "size": 4823, "modified": 1791520591.7608292, "editable": true, "symbols": [{"name": "validate_request", "kind": "函数", "start": 5, "end": 12, "doc": "接收问题，提取主题并区分缺参、越界和正常请求。"}, {"name": "ask_topic", "kind": "函数", "start": 14, "end": 16, "doc": "缺少主题时，明确请求补充，而不是猜测。"}, {"name": "search_catalog", "kind": "函数", "start": 18, "end": 24, "doc": "调用项目真实工具；捕获失败，提供明确失败状态供图路由。"}, {"name": "answer_courses", "kind": "函数", "start": 26, "end": 35, "doc": "有资料才回答；两种模型模式清楚分开。"}, {"name": "tool_error", "kind": "函数", "start": 37, "end": 39, "doc": "工具失败独立出口，避免宣称查询成功。"}, {"name": "no_result", "kind": "函数", "start": 41, "end": 43, "doc": "没有资料时如实回应。"}, {"name": "invalid_request", "kind": "函数", "start": 45, "end": 47, "doc": "类型错误不进入工具。"}, {"name": "outside_scope", "kind": "函数", "start": 49, "end": 51, "doc": "本任务只做课程咨询。"}, {"name": "agent_model", "kind": "函数", "start": 53, "end": 76, "doc": "动态路线：模型返回工具调用或最终回答；保存公开消息，不展示私有推理。"}, {"name": "agent_tools", "kind": "函数", "start": 78, "end": 89, "doc": "按模型公开 tool_calls 调用允许的工具；ToolMessage 对齐调用 ID。"}], "content": "\"\"\"课程咨询的真实节点。框架模式用模拟回答，real 模式调用真实模型。\"\"\"\nimport json\nfrom tools import search_courses\n\ndef validate_request(state, context):\n    \"\"\"接收问题，提取主题并区分缺参、越界和正常请求。\"\"\"\n    question = state.get('question', '')\n    if not isinstance(question, str): return {'topic': '', 'route': 'invalid'}\n    topic = question.strip()\n    if not topic: return {'topic': '', 'route': 'missing'}\n    if any(word in topic for word in ('转账', '天气', '删除文件')): return {'topic': topic, 'route': 'outside'}\n    return {'topic': topic, 'route': 'search'}\n\ndef ask_topic(state, context):\n    \"\"\"缺少主题时，明确请求补充，而不是猜测。\"\"\"\n    return {'answer': '请告诉我你想学习的课程主题。'}\n\ndef search_catalog(state, context):\n    \"\"\"调用项目真实工具；捕获失败，提供明确失败状态供图路由。\"\"\"\n    try:\n        result = search_courses(state['topic'])\n        return {'documents': result['items'], 'source': result['source'], 'error': ''}\n    except Exception as error:\n        return {'documents': [], 'source': '', 'error': str(error)}\n\ndef answer_courses(state, context):\n    \"\"\"有资料才回答；两种模型模式清楚分开。\"\"\"\n    if context['mode'] == 'real':\n        from langchain_openai import ChatOpenAI\n        import os\n        model = ChatOpenAI(model=os.environ.get('OPENAI_MODEL', 'gpt-4.1-mini'), timeout=25, max_retries=0)\n        reply = model.invoke('你是课程咨询助手。仅根据以下资料回答，不编造。问题：' + state['question']\n                             + '\\n资料：' + json.dumps(state['documents'], ensure_ascii=False))\n        return {'answer': str(reply.content)}\n    return {'answer': '【模拟模型】找到课程：' + json.dumps(state['documents'], ensure_ascii=False)}\n\ndef tool_error(state, context):\n    \"\"\"工具失败独立出口，避免宣称查询成功。\"\"\"\n    return {'answer': '课程查询失败，请稍后重试。'}\n\ndef no_result(state, context):\n    \"\"\"没有资料时如实回应。\"\"\"\n    return {'answer': '未找到该主题课程，请换一个主题。'}\n\ndef invalid_request(state, context):\n    \"\"\"类型错误不进入工具。\"\"\"\n    return {'answer': '问题必须是文字。'}\n\ndef outside_scope(state, context):\n    \"\"\"本任务只做课程咨询。\"\"\"\n    return {'answer': '我只能提供课程咨询，无法处理这个任务。'}\n\ndef agent_model(state, context):\n    \"\"\"动态路线：模型返回工具调用或最终回答；保存公开消息，不展示私有推理。\"\"\"\n    from langchain_core.messages import AIMessage, HumanMessage, messages_to_dict, messages_from_dict\n    messages = messages_from_dict(state.get('messages', []))\n    if not messages: messages = [HumanMessage(content=state['question'])]\n    attempts = state.get('attempts', 0) + 1\n    if attempts >= 3:\n        reply = AIMessage(content='已达到模型调用上限，结束本次任务。')\n    elif context['mode'] == 'real':\n        import os\n        from langchain_openai import ChatOpenAI\n        model = ChatOpenAI(model=os.environ.get('OPENAI_MODEL', 'gpt-4.1-mini'), timeout=25, max_retries=0)\n        reply = model.bind_tools([search_courses]).invoke(messages)\n    elif messages[-1].type == 'tool':\n        reply = AIMessage(content='【模拟模型】根据工具结果回答：' + str(messages[-1].content))\n    elif not state['question'].strip():\n        reply = AIMessage(content='请补充课程主题。')\n    elif any(word in state['question'] for word in ('转账', '天气', '删除文件')):\n        reply = AIMessage(content='我只能提供课程咨询。')\n    else:\n        reply = AIMessage(content='', tool_calls=[{'name': 'search_courses', 'args': {'topic': state['question']}, 'id': 'course_' + str(attempts), 'type': 'tool_call'}])\n    messages.append(reply)\n    return {'messages': messages_to_dict(messages), 'attempts': attempts,\n            'choice': 'tools' if reply.tool_calls else 'finish', 'answer': str(reply.content)}\n\ndef agent_tools(state, context):\n    \"\"\"按模型公开 tool_calls 调用允许的工具；ToolMessage 对齐调用 ID。\"\"\"\n    from langchain_core.messages import ToolMessage, messages_to_dict, messages_from_dict\n    messages = messages_from_dict(state['messages'])\n    for call in messages[-1].tool_calls:\n        try:\n            if call['name'] != 'search_courses': raise ValueError('不允许的工具')\n            value = search_courses(**call['args'])\n        except Exception as error:\n            value = {'error': str(error)}\n        messages.append(ToolMessage(content=json.dumps(value, ensure_ascii=False), tool_call_id=call['id']))\n    return {'messages': messages_to_dict(messages), 'tool_steps': state.get('tool_steps', 0) + 1}\n", "sha": "117ddeacce529c7ff0ed96b3156a454ebd5d05a9d57f68947e7ee7260a953f8e"}, {"path": "im   function nodeInspector(){if(!selectedNode&&['not-used','unmapped'].includes(structureScope().kind))return '<section class="panel node-inspector"><div class="eyebrow">CURRENT STRUCTURE</div><h2>'+escape(structureNames[moduleId])+'</h2><p>本结构没有已确认的实际节点对应关系。先查看本步设计决定和内部教学图；接入或补齐映射后，这里展示真实节点详情。</p></section>';const g=state().agent_graph,n=g.nodes.find(n=>n.id===selectedNode)||g.nodes.find(n=>!['START','END'].includes(n.id))||g.nodes[0];if(!n)return '<section class="panel"><h2>下一步：定义任务</h2><p>告诉 WorkBuddy 想让助手完成什么事，从输入到输出设计最小闭环。</p></section>';const spec=state().design.contracts.nodes[n.id]||{},f=snapshot.files.find(f=>f.path===spec.source),symbol=f?.symbols.find(x=>x.name===spec.function),outgoing=g.edges.filter(e=>e.from===n.id),fields=(values,empty)=>(values||[]).map(v=>`<span class="field-chip">${escape(v)}</span>`).join('')||`<span class="muted">${empty}</span>`;return `<section class="panel node-inspector"><div class="eyebrow">SELECTED NODE</div><h2>${escape(n.label||n.id)}</h2><span class="pill">${escape(n.kind||'处理节点')}</span><p class="node-description">${escape(n.description||symbol?.doc||(n.id==='START'?'接收用户输入，开始本轮任务。':n.id==='END'?'结束本轮任务，交付结果。':'读取指定字段，完成职责并产生状态更新。'))}</p><div class="io-row"><span>接收</span><div>${fields(spec.reads||(n.id==='START'?state().design.contracts.inputs:[]),'待定义输入')}</div></div><div class="io-row"><span>产出</span><div>${fields(spec.writes||(n.id==='END'?state().design.contracts.outputs:[]),'待定义输出')}</div></div><div class="detail-section"><h3>接下来到哪里</h3>${outgoing.map(e=>`<button class="route-row" data-node="${escape(e.to)}"><span>${escape(e.label||'完成后')}</span><i>→</i><b>${escape(g.nodes.find(n=>n.id===e.to)?.label||e.to)}</b></button>`).join('')||'<p class="muted">本轮在这里结束。</p>'}</div><div class="detail-section"><h3>对应实现</h3>${spec.source?`<button class="source-link" data-source-path="${escape(spec.source)}" data-source-line="${symbol?.start||1}"><b>${escape(spec.source)}</b><small>${escape(spec.function)}${symbol?' · 第 '+symbol.s uestions||[]).length?`<ul>${state().open_questions.map(q=>`<li>${escape(q)}</li>`).join('')}</ul>`:'<p class="muted">暂无已记录待办。</p>'}</section><details class="panel technical"><summary>项目文件地图与保存记录</summary><div class="table-wrap"><table><thead><tr><th>实际文件</th><th>职责</th><th>调用关系</th></tr></thead><tbody>${snapshot.files.map(f=>`<tr><td><button class="text-btn" data-open-file="${escape(f.path)}">${escape(f.path)}</button></td><td>${escape(f.purpose||'尚未登记')}</td><td>${escape(f.caller||'尚未登记')}</td></tr>`).join('')}</tbody></table></div><h3>最近网页保存</h3><div class="timeline">${(snapshot.activity||[]).slice(-12).reverse().map(a=>`<article><time>${timeLabel(a.time)}</time><p>${escape(a.action)} · ${escape(a.path)}</p></article>`).join('')||'<p class="muted">暂无网页保存记录，宿主的文件更新不冒充网页操作。</p>'}</div></details><details class="panel technical"><summary>完整项目数据 · 高级编辑</summary><p class="micro">旧项目的笔记和答题记录仅作历史保留，不参与设计完成条件。</p><textarea class="code-editor" id="state-json">${json(state())}</textarea><button class="btn" data-action="apply-json">应用到草稿</button><button class="btn primary" data-action="save">保存设计</button></details>`;}

  function download(name, content, type='application/json') {

  }

  async function selectModule(id){

    if(dirty()&&!offline){toast('当前有未保存草稿，请保存或放弃草稿后再同步切换步骤。',true);return;}
    if(offline){editState(s=>{s.current_module=id;s.current_action='';s.learning_stage=snapshot.step_registry.steps.find(x=>x.id===id).stage;});moduleId=id;selectedNode='';view='lesson';diagramScope='step';compareGraphs=false;render();toast('离线副本已切换，尚未同步到 WorkBuddy。');return;}

  async function post(url, body) {

    const data=await response.json();if(!response.ok)throw new Error(data.error||'保存失败');return data;

  async function save() {
    if(saving)return;

    if(offline){preserveDraft();toast('已保存本机浏览器草稿；未写回项目文件。可导出成果交给 WorkBuddy。');return;}
    saving=true;updateChrome();
    try {
      if(draftState){const saved=await post('/api/state',{state:draftState,expected_revision:draftRevision||snapshot.revision});draftState=null;draftRevision='';const previousChange=snapshot.state.design_changes?.at(-1)?.id;snapshot=saved;showChangedDiagram(previousChange);}
      for(const [path,draft] of [...draftFiles]){const saved=await post('/api/file',{path,content:draft.content,expected_sha:draft.sha});draftFiles.delete(path);snapshot=saved;}
      pendingSnapshot=null;preserveDraft();connection='ready';historyId='';toast('设计已保存，文档与变化记录已同步。');render();

  async function readLatest(manual=false) {
    if(saving)return;
    if(offline){if(manual)toast('独立 HTML 是成果副本。请启动本地工作台读取实时项目，或导入更新的进度 JSON。');return;}
    try {
      const response=await fetch('/api/snapshot'+(!manual&&snapshot?'?revision='+encodeURIComponent(snapshot.revision):''),{cache:'no-store'});
      const data=await response.json();if(!response.ok)throw new Error(data.error||'读取失败');
      if(snapshot&&data.token)snapshot.token=data.token;
      if(data.unchanged){if(connection==='error'){connection='ready';render();}return;}
      connection='ready';errorMessage='';
      if(snapshot&&dirty()&&!manual){pendingSnapshot=data;updateChrome();return;}
      if(manual&&dirty()){preserveDraft();draftState=null;draftRevision='';draftFiles=new Map();toast('已读取最新成果；之前的草稿保留在本机，可用“恢复草稿”取回。');}
      const previousChange=snapshot?.state.design_changes?.at(-1)?.id,previousCurrent=snapshot?.state.current_module;if(previousCurrent&&previousCurrent!==data.state.current_module){moduleId=data.state.current_module;selectedNode='';diagramScope='step';compareGraphs=false;}
      snapshot=data;showChangedDiagram(previousChange);pendingSnapshot=null;updateCount++;if(!moduleId||!snapshot.state.modules.some(m=>m.id===moduleId))moduleId=snapshot.state.current_module||snapshot.state.modules[0].id;
      if(!filePath||!snapshot.files.some(f=>f.path===filePath))filePath=snapshot.files.find(f=>f.path.endsWith('tools.py'))?.path||snapshot.files[0]?.path||'';
      traceIndex=Math.min(traceIndex,Math.max(0,(state().trace||[]).length-1));render();
      if(manual)toast('已读取最新成果。');
    }catch(error){connection='error';errorMessage='读取项目失败：'+error.message+'。保持本地服务运行，已有草稿不会丢失。';if(snapshot)render();else $('#app').innerHTML=`<div class="loading"><strong>项目暂时无法读取</strong><p>${escape(errorMessage)}</p><button class="btn" data-action="refresh">重新读取</button></div>`;}
  }
  function wireGraphDrag() {
    if(!graphEditing||view!=='graph')return;
    const svg=$('#editable-graph svg');if(!svg)return;
    svg.addEventListener('pointerdown',event=>{const group=event.target.closest('[data-node]');if(!group)return;const id=group.dataset.node;selectedNode=id;
      const toPoint=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
      const start=toPoint(event),node=state().agent_graph.nodes.find(n=>n.id===id);if(!node)return;
      const origin={x:Number(node.x??30),y:Number(node.y??35)};let moved=false,position=origin;
      svg.setPointerCapture(event.pointerId);
      const move=e=>{const p=toPoint(e);position={x:Math.max(0,Math.min(10000,Math.round(origin.x+p.x-start.x))),y:Math.max(0,Math.min(10000,Math.round(origin.y+p.y-start.y)))};moved=Math.abs(p.x-start.x)+Math.abs(p.y-start.y)>3;group.setAttribute('transform',`translate(${position.x-origin.x},${position.y-origin.y})`);};
      const up=()=>{svg.removeEventListener('pointermove',move);svg.removeEventListener('pointerup',up);if(moved)editState(s=>{Object.assign(s.agent_graph.nodes.find(n=>n.id===id),position);});render();};
      svg.addEventListener('pointermove',move);svg.addEventListener('pointerup',up,{once:true});
    });
  }

  $('#app').addEventListener('change',async event=>{
    if(event.target.id==='run-mode'){runMode=event.target.value;return;}
    if(event.target.id==='run-case'){runCase=event.target.value;const value=state().design.contracts.tests.find(t=>t.case===runCase)?.input;runQuestion=runCase==='custom'?'Python':typeof value==='string'?value:JSON.stringify(value);render();return;}
    if(event.target.id==='module-picker'){await selectModule(event.target.value);return;}
    if(event.target.id==='import-state'&&event.target.files[0]){try{const parsed=JSON.parse(await event.target.files[0].text()),s=parsed.state||parsed;if(!Array.isArray(s.modules)||s.modules.length!==15)throw new Error('文件不是完整课程进度。');draftState=s;draftRevision=snapshot.revision;preserveDraft();render();toast('进度已导入为草稿。核对后保存，不会立即覆盖项目。');}catch(error){toast(error.message,true);}}
  });
  $('#app').addEventListener('keydown',event=>{const node=event.target.closest('[data-node]');if(node&&['Enter',' '].includes(event.key)){event.preventDefault();selectedNode=node.dataset.node;render();}});
  window.addEventListener('beforeunload',event=>{if(dirty()&&!offline){event.preventDefault();event.returnValue='';}});
  async function boot(){
    if(offline){snapshot=JSON.parse($('#offline-data').textContent);moduleId=snapshot.state.current_module||snapshot.state.modules[0].id;filePath=snapshot.files.find(f=>f.path.endsWith('tools.py'))?.path||snapshot.files[0]?.path||'';connection='offline';render();}
    else {await readLatest();try{requestText=JSON.parse(localStorage.getItem(draftKey())||'null')?.requestText||'';}catch{}render();setInterval(()=>readLatest(),2500);}

  }
  boot();
})();
</script>
</body>
</html>
